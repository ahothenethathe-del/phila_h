<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Owner Dashboard | Braids by Phila</title><link rel="stylesheet" href="style.css"><link rel="stylesheet" href="owner.css"></head><body><header class="header"><a class="logo" href="index.html">Braids <span>by Phila</span></a><span>Private owner dashboard</span></header><main class="owner-wrap"><section id="loginPanel" class="owner-panel"><h1>Owner sign in</h1><p>Only authorised salon owners can view customer appointments.</p><form id="loginForm"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button class="btn" type="submit">Sign in</button></form></section><section id="dashboard" hidden><div class="owner-top"><div><h1>Appointments</h1><p>Manage bookings received from the website.</p></div><button class="btn" id="logout" type="button">Sign out</button></div><div class="owner-panel"><label for="filterDate">Show bookings for date</label><input type="date" id="filterDate"><button class="btn" id="reload" type="button">Refresh</button><div id="bookings" class="booking-list"></div></div></section><p id="message" role="status" aria-live="polite"></p></main><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><script src="owner.js"></script></body></html>
